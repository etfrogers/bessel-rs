[package]
name = "amos-bessel-rs"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An idiomatic Rust translation of Amos algorithm for calculating Bessel functions"
repository = "https://github.com/etfrogers/bessel-rs"
keywords = ["bessel-functions"]

[features]
# default = ["random_tests"]
random_tests = []

[dependencies]
num = { version = "0.4.3", default-features = false, features = ["std"] }
paste = "1.0.15"
thiserror = "2.0.17"


[dev-dependencies]
complex-bessel-rs = "1.3"
# complex-bessel-rs = { git = "https://github.com/etfrogers/complex-bessel-rs.git", branch = "bugfix-besseli" }
rand = "0.9.2"
rstest = "0.26.1"
rstest_reuse = "0.7.0"
criterion = "0.8.2"
complex-bessel = "0.2.0"
fortran-amos-testing = { path = "../fortran-amos-testing", version = "0.1.0" }
approx = { version = "0.5.1", features = ["num-complex"] }


[[bench]]
name = "bessel_bench"
harness = false

[[bench]]
name = "precision_bench"
harness = false
