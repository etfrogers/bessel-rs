name: Rust

on:
  push:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Install embedded no_std target
        run: rustup target add thumbv7em-none-eabihf

      - name: Check no_std bare-metal (amos-bessel-rs)
        run: cargo clippy -p amos-bessel-rs --no-default-features --target thumbv7em-none-eabihf -- -D warnings

      - name: Check no_std bare-metal (real-bessel)
        run: cargo clippy -p real-bessel --no-default-features --target thumbv7em-none-eabihf -- -D warnings

      - name: Check no_std bare-metal (bessel-zeros)
        run: cargo clippy -p bessel-zeros --no-default-features --target thumbv7em-none-eabihf -- -D warnings

      - name: Check no_std compilation (host)
        run: |
          cargo check -p amos-bessel-rs --no-default-features --lib
          cargo check -p real-bessel --no-default-features --lib
          cargo check -p bessel-zeros --no-default-features --lib
        env:
          RUSTFLAGS: "-D warnings"

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
